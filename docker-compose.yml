version: "3.9"

services:
  bot:
    build: .
    container_name: telebram_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - downloads:/tmp/tg_downloads
      - ./logs:/app/logs
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - bot_net

  redis:
    image: redis:7-alpine
    container_name: telebram_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - bot_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  downloads:
  redis_data:

networks:
  bot_net:
    driver: bridge
